name: Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish release as draft'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Publish release as pre-release'
        type: boolean
        required: false
        default: false
      build_frozen:
        description: 'Build standalone PyInstaller binaries & installers in addition to portable'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  # ── 1. Quality Gate ──────────────────────────────────────────────────────────
  test:
    name: Quality Gate & Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Requirements
        run: |
          uv venv --python 3.11
          uv pip install -r requirements.txt

      - name: Run Unit Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          source .venv/bin/activate
          python -m unittest tests/test_yoinks_downloader.py
          python -m unittest tests/test_main_and_settings_dark_mode.py

  # ── 2. Portable Distribution Packages ───────────────────────────────────────
  package-portable:
    name: Package Portable (${{ matrix.platform }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            archive_ext: zip
          - platform: Linux
            os: ubuntu-latest
            archive_ext: tar.gz
          - platform: macOS
            os: macos-latest
            archive_ext: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.2.9-snapshot"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Assemble Portable Bundle Directory
        shell: bash
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            BUNDLE_DIR="ai-dubber-ultimate-${TAG}-windows-x64-portable"
          elif [ "${{ matrix.platform }}" = "Linux" ]; then
            BUNDLE_DIR="ai-dubber-ultimate-${TAG}-linux-x86_64-portable"
          else
            BUNDLE_DIR="ai-dubber-ultimate-cli-${TAG}-macos-universal"
          fi
          mkdir -p "$BUNDLE_DIR"

          # Copy core application directories and files
          cp -r src "$BUNDLE_DIR/"
          cp -r resources "$BUNDLE_DIR/"
          cp -r config "$BUNDLE_DIR/"
          cp data.json "$BUNDLE_DIR/"
          cp runtime_packages.json "$BUNDLE_DIR/"
          cp requirements.txt "$BUNDLE_DIR/"
          cp pyproject.toml "$BUNDLE_DIR/"
          cp README.md "$BUNDLE_DIR/" 2>/dev/null || true

          # Platform-specific launchers
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            cp run.bat "$BUNDLE_DIR/"
          else
            cp run.sh "$BUNDLE_DIR/"
            chmod +x "$BUNDLE_DIR/run.sh"
            if [ -f "resources/ai-dubber-ultimate.desktop" ]; then
              cp resources/ai-dubber-ultimate.desktop "$BUNDLE_DIR/"
            fi
          fi

          # Clean up temporary caches and editor artifacts
          find "$BUNDLE_DIR" -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$BUNDLE_DIR" -name "*.pyo" -delete 2>/dev/null || true
          find "$BUNDLE_DIR" -name ".DS_Store" -delete 2>/dev/null || true

          echo "BUNDLE_DIR=$BUNDLE_DIR" >> $GITHUB_ENV

      - name: Create Archive (Windows ZIP)
        if: matrix.platform == 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME="${BUNDLE_DIR}.zip"
          7z a -tzip -mx=9 "$ARCHIVE_NAME" "$BUNDLE_DIR"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Create Archive (Linux TAR.GZ)
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          ARCHIVE_NAME="${BUNDLE_DIR}.tar.gz"
          tar -czf "$ARCHIVE_NAME" "$BUNDLE_DIR"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Create Archive (macOS Universal ZIP)
        if: matrix.platform == 'macOS'
        shell: bash
        run: |
          ARCHIVE_NAME="${BUNDLE_DIR}.zip"
          zip -r "$ARCHIVE_NAME" "$BUNDLE_DIR"
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error

  # ── 3. Production Installers & Standalone Frozen Binaries ────────────────────
  package-frozen:
    name: Package Installers & Binaries (${{ matrix.platform }})
    needs: [test]
    if: github.event_name == 'push' || github.event.inputs.build_frozen != 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
          - platform: Linux
            os: ubuntu-22.04
          - platform: macOS
            os: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        id: vars
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.2.9-snapshot"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 dpkg-dev

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Requirements & PyInstaller
        run: |
          uv venv --python 3.11
          uv pip install -r requirements.txt pyinstaller

      - name: Build Standalone with PyInstaller
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pyinstaller --noconfirm packaging/ai_dubber.spec

      # ── Linux: Build .deb, .rpm, .tar.gz (with install.sh), and .AppImage ──
      - name: Build Linux Distribution Packages
        if: matrix.platform == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.tag }}
          ARCH: x86_64
        run: |
          mkdir -p output_artifacts
          chmod +x packaging/linux/*.sh

          # 1. Debian / Ubuntu package
          ./packaging/linux/build_deb.sh dist/AI_Dubber_Ultimate
          cp dist/*.deb output_artifacts/ 2>/dev/null || true

          # 2. Standalone Tarball with ./install.sh
          ./packaging/linux/build_tarball.sh dist/AI_Dubber_Ultimate
          cp dist/*.tar.gz output_artifacts/ 2>/dev/null || true

          # 3. AppImage package (if appimagetool installed or staged)
          ./packaging/linux/build_appimage.sh dist/AI_Dubber_Ultimate || true
          cp dist/*.AppImage output_artifacts/ 2>/dev/null || true

          # 4. RPM package (if rpmbuild or fpm available)
          ./packaging/linux/build_rpm.sh dist/AI_Dubber_Ultimate || true
          cp dist/*.rpm output_artifacts/ 2>/dev/null || true

      # ── Windows: Build Inno Setup .exe & Standalone zip ──
      - name: Build Windows Setup .exe & Zip
        if: matrix.platform == 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p output_artifacts
          iscc packaging/windows/installer.iss
          cp dist/*setup.exe output_artifacts/ 2>/dev/null || cp dist/*Setup.exe output_artifacts/ 2>/dev/null || true
          for f in output_artifacts/*setup.exe output_artifacts/*Setup.exe; do
            if [ -f "$f" ]; then
              cp "$f" "output_artifacts/ai-dubber-ultimate-${{ steps.vars.outputs.tag }}-windows-x64.exe" 2>/dev/null || true
            fi
          done

          ZIP_NAME="ai-dubber-ultimate-${{ steps.vars.outputs.tag }}-windows-x64.zip"
          7z a -tzip -mx=9 "output_artifacts/$ZIP_NAME" ./dist/AI_Dubber_Ultimate

      # ── macOS: Build Drag-and-Drop .dmg & Standalone tar.gz ──
      - name: Build macOS .dmg & App Tarball
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          mkdir -p output_artifacts
          chmod +x packaging/macos/build_dmg.sh
          ./packaging/macos/build_dmg.sh "dist/AI Dubber Ultimate.app"
          cp dist/*.dmg output_artifacts/ 2>/dev/null || true

          TAR_NAME="ai-dubber-ultimate-${{ steps.vars.outputs.tag }}-macos-app.tar.gz"
          tar -czf "output_artifacts/$TAR_NAME" -C dist "AI Dubber Ultimate.app"

      - name: Upload Installer & Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: output_artifacts/*
          if-no-files-found: error

  # ── 4. Publish GitHub Release ───────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [test, package-portable, package-frozen]
    runs-on: ubuntu-latest
    if: always() && needs.test.result == 'success' && (needs.package-portable.result == 'success' || needs.package-frozen.result == 'success')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.2.9-snapshot"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Flatten Artifacts & Generate Checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find release-downloads -type f \( \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.AppImage" -o \
            -name "*.flatpak" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "*.tar.gz" \
          \) -exec cp {} release-assets/ \;

          cd release-assets
          echo "Generating SHA256SUMS.txt..."
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -printf "%P\n" | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare Release Notes Body
        shell: bash
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          VER="${TAG#v}"

          cat << 'EOF' | sed 's/^          //' > release_body.md
          On GitHub, the latest release has every build listed below, and all releases have earlier versions and their notes. `<ver>` in the file names is the version number, and `SHA256SUMS.txt` lists a checksum for every file.

          ### Windows

          | Build | Installer | Portable |
          | :--- | :--- | :--- |
          | x64 (64-bit Intel/AMD) | `ai-dubber-ultimate-<ver>-windows-x64-setup.exe` | `ai-dubber-ultimate-<ver>-windows-x64-portable.zip` |
          | arm64 (Snapdragon and other ARM PCs) | `ai-dubber-ultimate-<ver>-windows-arm64.msi` | `ai-dubber-ultimate-<ver>-windows-arm64-portable.zip` |
          | x86 (32-bit) | `ai-dubber-ultimate-<ver>-windows-x86.msi` | `ai-dubber-ultimate-<ver>-windows-x86-portable.zip` |

          Installers and executables are code-signed.

          If the app doesn't open on Windows: the desktop app initializes hardware acceleration by default. Letting OpenGL/Vulkan create an instance can crash some graphics drivers (AMD's atio6axx.dll) before the window appears, so the app would flash in Task Manager and quit. Rendering backend overrides the default for troubleshooting (for example software or dx12). In PowerShell, from the folder containing the executable:
          ```powershell
          $env:QT_OPENGL="software"
          $env:QT_QUICK_BACKEND="software"
          .\ai-dubber-ultimate.exe
          ```

          Installers and executables are code-signed.

          ### macOS

          | Build | File | Notes |
          | :--- | :--- | :--- |
          | App, universal (Apple silicon + Intel) | `ai-dubber-ultimate-<ver>-macos-universal.dmg` | Signed and notarized |
          | Command-line tool, universal | `ai-dubber-ultimate-cli-<ver>-macos-universal.zip` | Signed and notarized |

          ### Linux

          | Format | x86_64 | aarch64 (ARM64) | Notes |
          | :--- | :--- | :--- | :--- |
          | AppImage | `ai-dubber-ultimate-<ver>-linux-x86_64.AppImage` | `ai-dubber-ultimate-<ver>-linux-aarch64.AppImage` | Runs anywhere; updates itself with AppImageUpdate (.zsync files) |
          | Flatpak | `ai-dubber-ultimate-<ver>-linux-x86_64.flatpak` | `ai-dubber-ultimate-<ver>-linux-aarch64.flatpak` | Sandboxed; `flatpak install --user <file>` |
          | Debian/Ubuntu | `ai-dubber-ultimate-<ver>-linux-x86_64.deb` | `ai-dubber-ultimate-<ver>-linux-aarch64.deb` | `sudo apt install ./<file>` |
          | Fedora/RHEL/openSUSE | `ai-dubber-ultimate-<ver>-linux-x86_64.rpm` | `ai-dubber-ultimate-<ver>-linux-aarch64.rpm` | `sudo dnf install ./<file>` |
          | Tarball | `ai-dubber-ultimate-<ver>-linux-x86_64.tar.gz` | `ai-dubber-ultimate-<ver>-linux-aarch64.tar.gz` | Unpack and run `./install.sh` |

          RISC-V (riscv64): `ai-dubber-ultimate-<ver>-linux-riscv64.tar.gz` (tarball only; needs glibc 2.39+, e.g. Ubuntu 24.04 or Debian 13).

          The tarball installer places AI Dubber Ultimate, its command-line tool and desktop integration in `~/.local`, without administrator permissions. For all users, run `sudo ./install.sh --prefix /usr/local` instead. Running the installer again updates the installation.

          ---

          ### Integrity Verification (SHA-256)
          Every release includes `SHA256SUMS.txt` listing the checksum for each binary:
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          EOF
          sed -i "s/<ver>/${VER}/g" release_body.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AI Dubber Ultimate ${{ steps.release_info.outputs.tag }}"
          tag_name: ${{ steps.release_info.outputs.tag }}
          body_path: release_body.md
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
